[project]
name = "lumos-core"
version = "0.5.0"
description = "Lokaler, interner LumOS Office Core"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3", "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
